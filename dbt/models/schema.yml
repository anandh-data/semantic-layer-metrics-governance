version: 2
models:
  - name: stg_orders
    description: Canonical, typed order records shared by operations and analytics.
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: [open, closed, cancelled]
      - name: region
        tests:
          - accepted_values:
              arguments:
                values: [NORTHEAST, SOUTHEAST, MIDWEST, WEST]
  - name: fct_order_performance
    description: One row per order with governed lifecycle and recognized-revenue fields.
    columns:
      - name: order_id
        tests: [not_null, unique]
  - name: metric_daily_performance
    description: Governed daily metrics at date-region grain.
  - name: stg_hmda_applications
    description: Typed 2.8M-row analytical sample from the CFPB 2017 public HMDA file.
    columns:
      - name: action_taken
        tests: [not_null]
  - name: metric_governance_portfolio
    description: One governed value for each approved mortgage and title operations KPI.
    columns:
      - name: metric_name
        tests: [not_null, unique]
      - name: metric_value
        tests: [not_null]
