name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-failure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make test

  postgres-dbt-end-to-end:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: metrics
          POSTGRES_PASSWORD: metrics_local_only
          POSTGRES_DB: metrics
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U metrics -d metrics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 55432
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: metrics_local_only
      POSTGRES_DB: metrics
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python3 pipelines/run_pipeline.py --rows 5000 --seed 2026
      - run: make integration-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-evidence
          path: |
            logs/
            reports/
            screenshots/
